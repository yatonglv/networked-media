<html>
  <!-- Q: What type of content goes inside the <head>? 
    Does it show up on the webpage? -->
  <!-- A: The meta information! <title> <stylesheet> go inside the <head>, and it's not goona show up in the page, but show up in the tab -->

  <head>
    <title>class 5 demo 😌</title>
    <link href="style.css" rel="stylesheet" />
  </head>

  <!-- Q: What type of content goes inside the <body>? 
    Does it show up on the webpage? -->
  <!-- A: (content)The text and paragraph,also the bottons, you can insert the image and links, You can also adjust the font(italics/em/strong/and so on,
  this will all show up in web page)-->

  <body>
    <p>this is a paragraph</p>
    <p class="blue">this is a second paragraph</p>
    <p id="main">this is a third paragraph</p>

    <!-- now open up style.css -->
  </body>
</html>
